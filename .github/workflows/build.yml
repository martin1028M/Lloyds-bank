name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#11B67A' --iconBackgroundColorDark '#11B67A'
      - run: mkdir -p android/app/src/main/res/drawable && cp assets/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png
      - run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cavan-bank-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
